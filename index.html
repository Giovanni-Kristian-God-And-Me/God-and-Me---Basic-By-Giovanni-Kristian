<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Guru (Simplified)</title>
  
  <script src="newbookdb.js"></script>
  
  <style>
    :root {
      --primary: #8B3DFF;
      --primary-dark: #00C4CC;
      --bg: #F9FAFB;
      --card: #FFFFFF;
      --text: #0E1318;
      --border: #E5E7EB;
    }
    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: Arial, sans-serif;
      padding: 20px;
    }
    .container { max-width: 800px; margin: 0 auto; }
    .card { background: var(--card); padding: 24px; border-radius: 12px; margin-bottom: 24px; border: 1px solid var(--border); }
    h1, h2 { color: var(--primary); }
    .form-group { margin-bottom: 20px; }
    .checkbox-item { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; cursor: pointer; }
    .btn { background: var(--primary); color: white; border: none; padding: 12px 20px; border-radius: 8px; cursor: pointer; font-size: 1rem; width: 100%; }
    .btn:hover { opacity: 0.9; }
    .vocab-list { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 15px; }
    .vocab-item { background: #f1f5f9; padding: 10px; border-radius: 8px; border: 1px solid #cbd5e1; display: flex; align-items: center; gap: 8px; }
    .result-box { display: none; margin-top: 20px; }
    textarea { width: 100%; height: 100px; padding: 10px; border-radius: 8px; border: 1px solid var(--border); margin-bottom: 10px; }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>Dashboard Guru</h1>
    <p>Pilih buku, bab, dan tugas untuk murid.</p>
  </header>

  <div class="card">
    <h2>1. Pilih Buku & Bab</h2>
    <div class="form-group" style="margin-top: 15px;">
      <select id="bookSelect" style="width:100%; padding: 10px; margin-bottom: 15px;">
        <option value="">-- Pilih Buku --</option>
      </select>
    </div>
    <div id="chaptersContainer" class="form-group">
      <!-- Bab checkboxes akan muncul di sini -->
    </div>
  </div>

  <div class="card">
    <h2>2. Pilih Kosakata</h2>
    <div id="vocabContainer" class="vocab-list">
      <p style="color: gray;">Pilih bab terlebih dahulu...</p>
    </div>
  </div>

    <button class="btn" id="generateBtn" style="margin-top: 20px;">Buat Link Tugas</button>
  </div>

  <div class="card result-box" id="resultBox">
    <h2>Link Tugas Berhasil Dibuat!</h2>
    <p>Kirimkan link ini kepada murid Anda:</p>
    <textarea id="linkOutput" readonly></textarea>
    <button class="btn" id="copyBtn" style="background: var(--primary-dark);">Copy Link</button>
  </div>
</div>

<script>
  const bookSelect = document.getElementById('bookSelect');
  const chaptersContainer = document.getElementById('chaptersContainer');
  const vocabContainer = document.getElementById('vocabContainer');
  const generateBtn = document.getElementById('generateBtn');
  const resultBox = document.getElementById('resultBox');
  const linkOutput = document.getElementById('linkOutput');
  const copyBtn = document.getElementById('copyBtn');
  
  let selectedVocabs = [];

  // Init Book Select
  if (typeof _bookDB !== 'undefined') {
    Object.keys(_bookDB).forEach(bookKey => {
      const option = document.createElement('option');
      option.value = bookKey;
      option.textContent = bookKey;
      bookSelect.appendChild(option);
    });
  }

  bookSelect.addEventListener('change', () => {
    chaptersContainer.innerHTML = '';
    vocabContainer.innerHTML = '<p style="color: gray;">Pilih bab terlebih dahulu...</p>';
    selectedVocabs = [];
    
    const book = bookSelect.value;
    if (!book || !_bookDB[book]) return;
    
    Object.keys(_bookDB[book]).forEach(chapterKey => {
      const chapter = _bookDB[book][chapterKey];
      const label = document.createElement('label');
      label.className = 'checkbox-item';
      const checkbox = document.createElement('input');
      checkbox.type = 'checkbox';
      checkbox.value = chapterKey;
      checkbox.addEventListener('change', renderVocab);
      
      label.appendChild(checkbox);
      label.appendChild(document.createTextNode(` ${chapterKey} - ${chapter.title}`));
      chaptersContainer.appendChild(label);
    });
  });

  function renderVocab() {
    vocabContainer.innerHTML = '';
    selectedVocabs = [];
    const book = bookSelect.value;
    if (!book) return;
    
    const checkboxes = chaptersContainer.querySelectorAll('input[type="checkbox"]:checked');
    if (checkboxes.length === 0) {
      vocabContainer.innerHTML = '<p style="color: gray;">Pilih bab terlebih dahulu...</p>';
      return;
    }
    
    checkboxes.forEach(cb => {
      const chapterKey = cb.value;
      const vocabs = _bookDB[book][chapterKey].vocab;
      
      vocabs.forEach((v, index) => {
        const item = document.createElement('div');
        item.className = 'vocab-item';
        
        const checkbox = document.createElement('input');
        checkbox.type = 'checkbox';
        checkbox.checked = true; // default checked
        checkbox.dataset.char = v.char;
        checkbox.dataset.pinyin = v.pinyin;
        checkbox.dataset.meaning = v.id;
        checkbox.dataset.chapter = chapterKey;
        
        checkbox.addEventListener('change', updateSelectedVocabList);
        
        const text = document.createElement('span');
        text.innerHTML = `<strong>${v.char}</strong> (${v.pinyin})`;
        
        item.appendChild(checkbox);
        item.appendChild(text);
        vocabContainer.appendChild(item);
      });
    });
    
    updateSelectedVocabList();
  }
  
  function updateSelectedVocabList() {
    selectedVocabs = [];
    const checkboxes = vocabContainer.querySelectorAll('input[type="checkbox"]:checked');
    checkboxes.forEach(cb => {
      selectedVocabs.push({
        char: cb.dataset.char,
        chapter: cb.dataset.chapter
      });
    });
    generateBtn.textContent = `Generate Link Tugas (${selectedVocabs.length} Kosakata)`;
  }

  generateBtn.addEventListener('click', () => {
    if (selectedVocabs.length === 0) {
      alert("Pilih minimal 1 kosakata!");
      return;
    }
    
    // Format baru: hanya simpan referensi nama buku, bab, dan karakter
    const book = bookSelect.value;
    const vMap = {};
    selectedVocabs.forEach(v => {
      if (!vMap[v.chapter]) vMap[v.chapter] = [];
      vMap[v.chapter].push(v.char);
    });
    
    const payload = {
      b: book,
      v: vMap
    };
    
    const payloadStr = JSON.stringify(payload);
    // Base64 encode
    const base64Data = btoa(unescape(encodeURIComponent(payloadStr)));
    
    // Asumsi URL diakses dari tempat yang sama, ambil path parent
    const currentUrl = window.location.href.split('?')[0].split('#')[0];
    const basePath = currentUrl.substring(0, currentUrl.lastIndexOf('/'));
    const studentUrl = `${basePath}/student.html#data=${base64Data}`;
    
    linkOutput.value = studentUrl;
    resultBox.style.display = 'block';
  });

  copyBtn.addEventListener('click', () => {
    linkOutput.select();
    document.execCommand('copy');
    copyBtn.textContent = 'Tersalin!';
    setTimeout(() => copyBtn.textContent = 'Copy Link', 2000);
  });
</script>

</body>
</html>
